<!DOCTYPE html>
<html lang="he">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>הקלטת הדגמה — BizUply</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #24183d;
        --muted: #5c5470;
        --line: rgba(91, 33, 182, 0.22);
        --brand: #48218b;
      }

      * { box-sizing: border-box; }

      html, body { margin: 0; }

      body {
        min-height: 100%;
        background: #f6f3fb;
        color: var(--ink);
        font-family: "Segoe UI", Arial, sans-serif;
      }

      .page {
        width: min(100%, 430px);
        margin: 0 auto;
        padding: 12px 12px 28px;
      }

      h1 {
        margin: 4px 0 6px;
        font-size: 18px;
        line-height: 1.3;
      }

      .note {
        margin: 0 0 12px;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.45;
      }

      .stage {
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 22px;
        background: #fff;
        box-shadow: 0 18px 40px -28px rgba(72, 33, 139, 0.9);
      }

      video {
        display: block;
        width: 100%;
        height: auto;
        background: #f7f8fc;
      }

      .player {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px 10px;
        direction: ltr;
      }

      .player button {
        display: grid;
        width: 32px;
        height: 32px;
        flex: 0 0 auto;
        place-items: center;
        padding: 0;
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: var(--brand);
        cursor: pointer;
      }

      .player button:focus-visible,
      .range:focus-visible {
        outline: 2px solid #5b21b6;
        outline-offset: 2px;
      }

      .time {
        flex: 0 0 auto;
        color: #3f3a52;
        font-size: 12px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }

      .range {
        flex: 1 1 auto;
        min-width: 0;
        height: 16px;
        margin: 0;
        appearance: none;
        background: transparent;
        cursor: pointer;
      }

      .range::-webkit-slider-runnable-track {
        height: 4px;
        border-radius: 999px;
        background: linear-gradient(to right, #6d28d9 var(--p, 0%), #ddd6fe var(--p, 0%));
      }

      .range::-webkit-slider-thumb {
        appearance: none;
        width: 14px;
        height: 14px;
        margin-top: -5px;
        border: 2px solid #fff;
        border-radius: 50%;
        background: #7c3aed;
      }

      .range::-moz-range-track {
        height: 4px;
        border: 0;
        border-radius: 999px;
        background: #ddd6fe;
      }

      .range::-moz-range-progress {
        height: 4px;
        border-radius: 999px;
        background: #6d28d9;
      }

      .range::-moz-range-thumb {
        width: 14px;
        height: 14px;
        border: 2px solid #fff;
        border-radius: 50%;
        background: #7c3aed;
      }

      .stage:fullscreen {
        display: flex;
        flex-direction: column;
        justify-content: center;
        border-radius: 0;
        background: #0f0a1a;
      }

      .stage:fullscreen video { max-height: calc(100vh - 52px); margin: 0 auto; }
      .stage:fullscreen .player { background: #fff; }
    </style>
  </head>
  <body>
    <main class="page">
      <h1>הקלטת המערכת</h1>
      <p class="note">הקלטה אמיתית מחשבון ההדגמה הפנימי. דף הבית לא הוחלף.</p>
      <div class="stage" id="stage">
        <video id="film" playsinline preload="metadata" poster="" src="bizuply-mobile-demo.mp4"></video>
        <div class="player">
          <button type="button" id="play" aria-label="ניגון">
            <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M4 2.5v11l10-5.5z"/></svg>
          </button>
          <span class="time" id="time">0:00</span>
          <input class="range" id="scrub" type="range" min="0" max="1000" value="0" aria-label="מיקום בסרטון" />
          <button type="button" id="mute" aria-label="השתקה">
            <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M2 6h2.5L8 3.2v9.6L4.5 10H2V6zm9.2.2 1.1 1.1-1.4 1.4 1.4 1.4-1.1 1.1L10.8 9.8 9.4 11.2 8.3 10.1 9.7 8.7 8.3 7.3l1.1-1.1 1.4 1.4z"/></svg>
          </button>
          <button type="button" id="full" aria-label="מסך מלא">
            <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M2 6V2h4v1.6H3.6V6H2zm8-4h4v4h-1.6V3.6H10V2zM3.6 10H2v4h4v-1.6H3.6V10zm8.8 2.4H14v-4h-1.6v2.4H10V14h2.4v-1.6z"/></svg>
          </button>
        </div>
      </div>
    </main>
    <script>
      const film = document.getElementById("film");
      const play = document.getElementById("play");
      const mute = document.getElementById("mute");
      const full = document.getElementById("full");
      const scrub = document.getElementById("scrub");
      const time = document.getElementById("time");
      const stage = document.getElementById("stage");
      const playIcon = play.innerHTML;
      const pauseIcon = '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M3 2h3.2v12H3zm6.8 0H13v12H9.8z"/></svg>';
      const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      function clock(value) {
        const seconds = Math.max(0, Math.floor(value || 0));
        return Math.floor(seconds / 60) + ":" + String(seconds % 60).padStart(2, "0");
      }

      function paint() {
        const duration = film.duration || 0;
        const now = film.currentTime || 0;
        time.textContent = clock(now);
        const progress = duration ? (now / duration) * 1000 : 0;
        if (!scrub.matches(":active")) scrub.value = String(progress);
        scrub.style.setProperty("--p", (progress / 10) + "%");
        const playing = !film.paused && !film.ended;
        play.innerHTML = playing ? pauseIcon : playIcon;
        play.setAttribute("aria-label", playing ? "השהיה" : "ניגון");
        mute.setAttribute("aria-pressed", film.muted ? "true" : "false");
        mute.setAttribute("aria-label", film.muted ? "ביטול השתקה" : "השתקה");
      }

      play.addEventListener("click", () => {
        if (film.paused || film.ended) film.play();
        else film.pause();
      });
      mute.addEventListener("click", () => {
        film.muted = !film.muted;
        paint();
      });
      full.addEventListener("click", () => {
        if (document.fullscreenElement) document.exitFullscreen();
        else stage.requestFullscreen();
      });
      scrub.addEventListener("input", () => {
        if (!film.duration) return;
        film.currentTime = (Number(scrub.value) / 1000) * film.duration;
        paint();
      });
      film.addEventListener("timeupdate", paint);
      film.addEventListener("play", paint);
      film.addEventListener("pause", paint);
      film.addEventListener("loadedmetadata", paint);

      film.muted = true;
      if (!reduced && "IntersectionObserver" in window) {
        const watcher = new IntersectionObserver((entries) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting) film.play().catch(() => {});
            else film.pause();
          });
        }, { threshold: 0.45 });
        watcher.observe(film);
      }
    </script>
  </body>
</html>
