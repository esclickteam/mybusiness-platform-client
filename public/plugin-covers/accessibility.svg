<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <defs>
    <linearGradient id="bg-accessibility" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgb(144,206,220)"/>
      <stop offset="45%" stop-color="rgb(201,231,238)"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="640" height="400" fill="url(#bg-accessibility)"/>
  <circle cx="520" cy="80" r="90" fill="#0891B2" opacity="0.08"/>
  <circle cx="100" cy="320" r="70" fill="#0891B2" opacity="0.06"/>
  
    <g filter="url(#shadow)">
      <rect x="180" y="115" width="280" height="170" rx="10" fill="#fff"/>
      <rect x="180" y="115" width="280" height="28" rx="10" fill="rgb(218,239,243)"/>
      <rect x="180" y="133" width="280" height="10" fill="rgb(218,239,243)"/>
      <circle cx="198" cy="129" r="5" fill="#FCA5A5"/>
      <circle cx="214" cy="129" r="5" fill="#FCD34D"/>
      <circle cx="230" cy="129" r="5" fill="#86EFAC"/>
      <rect x="250" y="123" width="190" height="12" rx="6" fill="#fff" opacity="0.8"/>
      
    <circle cx="320" cy="210" r="35" fill="none" stroke="#0891B2" stroke-width="4"/>
    <circle cx="320" cy="195" r="8" fill="#0891B2"/>
    <line x1="320" y1="203" x2="320" y2="235" stroke="#0891B2" stroke-width="4"/>
    <line x1="300" y1="218" x2="340" y2="218" stroke="#0891B2" stroke-width="4"/>
    <line x1="305" y1="235" x2="295" y2="255" stroke="#0891B2" stroke-width="4"/>
    <line x1="335" y1="235" x2="345" y2="255" stroke="#0891B2" stroke-width="4"/>
  
    </g>
</svg>