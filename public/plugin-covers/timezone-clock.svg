<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <defs>
    <linearGradient id="bg-timezone-clock" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgb(157,185,246)"/>
      <stop offset="45%" stop-color="rgb(207,221,251)"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="640" height="400" fill="url(#bg-timezone-clock)"/>
  <circle cx="520" cy="80" r="90" fill="#2563EB" opacity="0.08"/>
  <circle cx="100" cy="320" r="70" fill="#2563EB" opacity="0.06"/>
  
    <g filter="url(#shadow)">
      <rect x="180" y="115" width="280" height="170" rx="10" fill="#fff"/>
      <rect x="180" y="115" width="280" height="28" rx="10" fill="rgb(222,232,252)"/>
      <rect x="180" y="133" width="280" height="10" fill="rgb(222,232,252)"/>
      <circle cx="198" cy="129" r="5" fill="#FCA5A5"/>
      <circle cx="214" cy="129" r="5" fill="#FCD34D"/>
      <circle cx="230" cy="129" r="5" fill="#86EFAC"/>
      <rect x="250" y="123" width="190" height="12" rx="6" fill="#fff" opacity="0.8"/>
      
    <circle cx="320" cy="215" r="45" fill="#fff" stroke="#2563EB" stroke-width="3"/>
    <line x1="320" y1="215" x2="320" y2="185" stroke="#2563EB" stroke-width="3" stroke-linecap="round"/>
    <line x1="320" y1="215" x2="345" y2="215" stroke="rgb(28,74,176)" stroke-width="2" stroke-linecap="round"/>
    <circle cx="320" cy="215" r="4" fill="#2563EB"/>
    <text x="320" y="275" text-anchor="middle" fill="#2563EB" font-size="11" font-family="system-ui">14:30</text>
  
