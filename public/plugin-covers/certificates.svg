<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <defs>
    <linearGradient id="bg-certificates" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgb(231,202,142)"/>
      <stop offset="45%" stop-color="rgb(243,229,200)"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="640" height="400" fill="url(#bg-certificates)"/>
  <circle cx="520" cy="80" r="90" fill="#CA8A04" opacity="0.08"/>
  <circle cx="100" cy="320" r="70" fill="#CA8A04" opacity="0.06"/>
  
    <g filter="url(#shadow)">
      <rect x="180" y="115" width="280" height="170" rx="10" fill="#fff"/>
      <rect x="180" y="115" width="280" height="28" rx="10" fill="rgb(247,237,217)"/>
      <rect x="180" y="133" width="280" height="10" fill="rgb(247,237,217)"/>
      <circle cx="198" cy="129" r="5" fill="#FCA5A5"/>
      <circle cx="214" cy="129" r="5" fill="#FCD34D"/>
      <circle cx="230" cy="129" r="5" fill="#86EFAC"/>
      <rect x="250" y="123" width="190" height="12" rx="6" fill="#fff" opacity="0.8"/>
      
    <rect x="250" y="165" width="140" height="100" rx="4" fill="rgb(249,241,225)" stroke="#CA8A04" stroke-width="2"/>
    <circle cx="320" cy="200" r="20" fill="none" stroke="#CA8A04" stroke-width="2"/>
    <rect x="270" y="230" width="100" height="6" rx="2" fill="#CA8A04" opacity="0.4"/>
    <rect x="280" y="245" width="80" height="6" rx="2" fill="#CA8A04" opacity="0.3"/>
  
    </g>
</svg>