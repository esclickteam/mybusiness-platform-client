      <circle cx="198" cy="129" r="5" fill="#FCA5A5"/>
      <circle cx="214" cy="129" r="5" fill="#FCD34D"/>
      <circle cx="230" cy="129" r="5" fill="#86EFAC"/>
      <rect x="250" y="123" width="190" height="12" rx="6" fill="#fff" opacity="0.8"/>
      
    <rect x="230" y="160" width="200" height="35" rx="8" fill="#2563EB" opacity="0.9"/>
    <rect x="240" y="205" width="180" height="22" rx="6" fill="#fff" stroke="rgb(113,154,242)" stroke-width="2"/>
    <rect x="240" y="235" width="180" height="22" rx="6" fill="#fff" stroke="rgb(113,154,242)" stroke-width="2"/>
    <rect x="240" y="265" width="180" height="22" rx="6" fill="rgb(211,224,251)" stroke="#2563EB" stroke-width="2"/>
  
