<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <defs>
    <linearGradient id="bg-business-hours" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgb(141,200,230)"/>
      <stop offset="45%" stop-color="rgb(199,228,243)"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="640" height="400" fill="url(#bg-business-hours)"/>
  <circle cx="520" cy="80" r="90" fill="#0284C7" opacity="0.08"/>
  <circle cx="100" cy="320" r="70" fill="#0284C7" opacity="0.06"/>
  
    <g filter="url(#shadow)">
      <rect x="180" y="115" width="280" height="170" rx="10" fill="#fff"/>
      <rect x="180" y="115" width="280" height="28" rx="10" fill="rgb(217,237,247)"/>
      <rect x="180" y="133" width="280" height="10" fill="rgb(217,237,247)"/>
      <circle cx="198" cy="129" r="5" fill="#FCA5A5"/>
      <circle cx="214" cy="129" r="5" fill="#FCD34D"/>
      <circle cx="230" cy="129" r="5" fill="#86EFAC"/>
      <rect x="250" y="123" width="190" height="12" rx="6" fill="#fff" opacity="0.8"/>
      
    <rect x="240" y="175" width="160" height="80" rx="10" fill="#fff" stroke="#0284C7" stroke-width="2"/>
    <circle cx="320" cy="205" r="6" fill="#22C55E"/>
    <text x="335" y="210" fill="#22C55E" font-size="12" font-weight="700" font-family="system-ui">פתוחים</text>
    <rect x="255" y="225" width="130" height="8" rx="3" fill="#e2e8f0"/>
    <rect x="255" y="240" width="90" height="8" rx="3" fill="#e2e8f0"/>
  
    </g>
</svg>