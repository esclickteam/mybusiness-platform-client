<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <defs>
    <linearGradient id="bg-callback-widget" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgb(185,186,249)"/>
      <stop offset="45%" stop-color="rgb(221,221,252)"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="640" height="400" fill="url(#bg-callback-widget)"/>
  <circle cx="520" cy="80" r="90" fill="#6366F1" opacity="0.08"/>
  <circle cx="100" cy="320" r="70" fill="#6366F1" opacity="0.06"/>
  
    <g filter="url(#shadow)">
      <rect x="180" y="115" width="280" height="170" rx="10" fill="#fff"/>
      <rect x="180" y="115" width="280" height="28" rx="10" fill="rgb(232,232,253)"/>
      <rect x="180" y="133" width="280" height="10" fill="rgb(232,232,253)"/>
      <circle cx="198" cy="129" r="5" fill="#FCA5A5"/>
      <circle cx="214" cy="129" r="5" fill="#FCD34D"/>
      <circle cx="230" cy="129" r="5" fill="#86EFAC"/>
      <rect x="250" y="123" width="190" height="12" rx="6" fill="#fff" opacity="0.8"/>
      
    <rect x="350" y="160" width="90" height="130" rx="8" fill="#fff" stroke="#6366F1" stroke-width="2" filter="url(#shadow)"/>
    <rect x="360" y="175" width="70" height="14" rx="4" fill="rgb(239,240,254)"/>
    <rect x="360" y="198" width="70" height="14" rx="4" fill="rgb(239,240,254)"/>
    <rect x="360" y="230" width="70" height="22" rx="6" fill="#6366F1"/>
  
    </g>
</svg>