<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <defs>
    <linearGradient id="bg-local-weather" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgb(165,225,252)"/>
      <stop offset="45%" stop-color="rgb(211,240,253)"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="640" height="400" fill="url(#bg-local-weather)"/>
  <circle cx="520" cy="80" r="90" fill="#38BDF8" opacity="0.08"/>
  <circle cx="100" cy="320" r="70" fill="#38BDF8" opacity="0.06"/>
  
    <g filter="url(#shadow)">
      <rect x="180" y="115" width="280" height="170" rx="10" fill="#fff"/>
      <rect x="180" y="115" width="280" height="28" rx="10" fill="rgb(225,245,254)"/>
      <rect x="180" y="133" width="280" height="10" fill="rgb(225,245,254)"/>
      <circle cx="198" cy="129" r="5" fill="#FCA5A5"/>
      <circle cx="214" cy="129" r="5" fill="#FCD34D"/>
      <circle cx="230" cy="129" r="5" fill="#86EFAC"/>
      <rect x="250" y="123" width="190" height="12" rx="6" fill="#fff" opacity="0.8"/>
      
    <circle cx="290" cy="200" r="22" fill="#FCD34D"/>
    <path d="M330 210 Q350 195 365 210 Q375 225 355 230 L300 230 Q275 230 280 210 Q285 200 300 205" fill="rgb(126,212,250)"/>
    <text x="320" y="255" text-anchor="middle" fill="rgb(42,142,186)" font-size="16" font-weight="600" font-family="system-ui">24°C</text>
  
    </g>
