<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        try {
          // Always re-detect from location on load (not a sticky manual choice).
          localStorage.removeItem("bizuply_lang_manual");
          sessionStorage.removeItem("bizuply_lang_session");

          var lang = "en";
          var tzHe = false;
          var navHe = false;

          try {
            tzHe =
              Intl.DateTimeFormat().resolvedOptions().timeZone ===
              "Asia/Jerusalem";
          } catch (e1) {}

          try {
            var langs = [navigator.language].concat(navigator.languages || []);
            navHe = langs.some(function (value) {
              return String(value || "")
                .toLowerCase()
                .indexOf("he") === 0;
            });
          } catch (e2) {}

          // Israel signals win over a stale English geo cookie from earlier tests.
          if (tzHe || navHe) {
            lang = "he";
          } else {
            var match = document.cookie.match(
              /(?:^|; )bizuply_geo_lang=([^;]+)/
            );
            if (match) lang = decodeURIComponent(match[1]);
          }

          if (lang !== "he" && lang !== "en") lang = "en";
          document.cookie =
            "bizuply_geo_lang=" +
            lang +
            "; Path=/; Max-Age=2592000; SameSite=Lax";
          document.documentElement.lang = lang;
          document.documentElement.dir = lang === "he" ? "rtl" : "ltr";
        } catch (e) {}
      })();
    </script>

    <!-- Detect published customer hosts early (custom domains + sites.*) -->
    <script>
      (function () {
        try {
          var host = String(location.hostname || "").toLowerCase();
          var publicDomain = "sites.bizuply.com";
          var marketing = {
            "bizuply.com": 1,
            "www.bizuply.com": 1,
            localhost: 1,
            "127.0.0.1": 1,
          };
          var isCustomer =
            (host.endsWith("." + publicDomain) && host !== publicDomain) ||
            (host.endsWith(".bizuply.com") &&
              host !== "bizuply.com" &&
              host !== "www.bizuply.com") ||
            (!marketing[host] &&
              !/\.vercel\.app$/.test(host) &&
              host.indexOf(".") !== -1);
          if (isCustomer) {
            document.documentElement.setAttribute("data-public-site", "true");
            window.__BIZUPLY_PUBLIC_SITE__ = true;
          }
        } catch (e) {}
      })();
    </script>

    <!-- ✅ Meta / Facebook Domain Verification -->
    <meta
      name="facebook-domain-verification"
      content="azd93f5jgru1b53xrjj0dqaco20viu"
    />

    <!-- ✅ Meta Pixel — platform marketing only (never on published customer sites) -->
    <script>
      (function () {
        if (window.__BIZUPLY_PUBLIC_SITE__) return;
        !(function (f, b, e, v, n, t, s) {
          if (f.fbq) return;
          n = f.fbq = function () {
            n.callMethod
              ? n.callMethod.apply(n, arguments)
              : n.queue.push(arguments);
          };
          if (!f._fbq) f._fbq = n;
          n.push = n;
          n.loaded = !0;
          n.version = "2.0";
          n.queue = [];
          t = b.createElement(e);
          t.async = !0;
          t.src = v;
          s = b.getElementsByTagName(e)[0];
          s.parentNode.insertBefore(t, s);
        })(
          window,
          document,
          "script",
          "https://connect.facebook.net/en_US/fbevents.js"
        );

        fbq("init", "1427327632368128");
        fbq("track", "PageView");
      })();
    </script>

    <!-- Platform fonts — skipped on published sites + embed previews -->
    <script>
      (function () {
        var isEmbed =
          String(location.pathname || "").indexOf("/embed/") === 0;
        // Embeds render customer templates; platform fonts only cause CORS noise
        // during html-to-image card screenshots.
        if (window.__BIZUPLY_PUBLIC_SITE__ || isEmbed) return;
        var pre1 = document.createElement("link");
        pre1.rel = "preconnect";
        pre1.href = "https://fonts.googleapis.com";
        document.head.appendChild(pre1);
        var pre2 = document.createElement("link");
        pre2.rel = "preconnect";
        pre2.href = "https://fonts.gstatic.com";
        pre2.crossOrigin = "anonymous";
        document.head.appendChild(pre2);
        var css = document.createElement("link");
        css.rel = "stylesheet";
        css.href =
          "https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap";
        // Required so cssRules can be read (html-to-image / capture tools).
        css.setAttribute("crossorigin", "anonymous");
        document.head.appendChild(css);
      })();
    </script>

    <!-- 🧠 SEO -->
    <title>BizUply — Business Platform</title>
    <meta
      name="description"
      content="BizUply — advanced business platform for managing clients, profiles, bookings, payments, and automation in one place."
    />
    <meta
      name="keywords"
      content="bizuply, business platform, crm, scheduling, bookings, saas, ai assistant, automation, business management"
    />
    <meta name="author" content="BizUply" />
    <meta http-equiv="Content-Language" content="en" />

    <!-- ⚡ Neutral first paint on published customer sites (no Bizuply splash) -->
    <script>
      (function () {
        if (window.__BIZUPLY_PUBLIC_SITE__) {
          document.documentElement.style.background = "#ffffff";
          if (document.body) document.body.style.backgroundColor = "#ffffff";
          document.title = "";
          return;
        }
        document.documentElement.style.background =
          "linear-gradient(to bottom, #f6f7fb, #e8ebf8)";
        if (document.body) document.body.style.backgroundColor = "#f6f7fb";
      })();
    </script>

    <!-- 🎨 Theme Variables (CRITICAL CSS ONLY) -->
    <style>
      :root {
        --bg: #f6f7fb;
        --surface: #ffffff;
        --surface-2: #f3f5fb;
        --border: #e8ecf5;
        --text: #0f172a;
        --muted: #475569;
        --violet: #6a11cb;
        --violet-600: #5a0fb0;
        --violet-100: #efe6fb;
        --blue: #2575fc;
        --blue-50: #e9f0ff;
        --success: #16a34a;
        --warning: #f59e0b;
        --danger: #ef4444;
        --ring: rgba(106, 17, 203, 0.28);
        --shadow: 0 10px 30px rgba(16, 24, 40, 0.08);
        --accent-gradient: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: linear-gradient(to bottom, #f6f7fb, #e8ebf8);
        color: var(--text);
        font-family: "Assistant", "Inter", system-ui, sans-serif;
        overflow-x: hidden;
      }

      html[data-public-site="true"],
      html[data-public-site="true"] body {
        background: #ffffff !important;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial,
          sans-serif;
      }

      html[data-public-site="true"] #root {
        background: #ffffff;
      }

      #initial-bg {
        position: fixed;
        inset: 0;
        background: linear-gradient(to bottom, #f6f7fb, #e8ebf8);
        z-index: -1;
        pointer-events: none;
      }

      html[data-public-site="true"] #initial-bg {
        background: #ffffff;
      }

      #root {
        min-height: 100vh;
        background: var(--bg);
      }
    </style>

    <!-- ✅ Favicons -->
    <link rel="icon" href="/favicon-v2.png?v=2" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-v3.png?v=2" />
    <!-- use-credentials: Vercel Deployment Protection / SSO blocks credential-less manifest fetches -->
    <link rel="manifest" href="/site.webmanifest" crossorigin="use-credentials" />
    <meta name="theme-color" content="#6a11cb" />
    <meta name="apple-mobile-web-app-title" content="BizUply" />
    <meta name="application-name" content="BizUply" />
    <meta name="msapplication-TileColor" content="#6a11cb" />
    <meta name="msapplication-config" content="/browserconfig.xml" />

    <!-- 🧩 Social Preview -->
    <meta property="og:title" content="BizUply — Business Platform" />
    <meta
      property="og:description"
      content="Manage clients, profiles, bookings and payments — all in one smart platform."
    />
    <meta property="og:image" content="https://bizuply.com/social-preview.png" />
    <meta property="og:url" content="https://bizuply.com" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- 📦 Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "BizUply",
        "url": "https://bizuply.com",
        "logo": "https://bizuply.com/favicon-v2.png",
        "sameAs": [
          "https://www.facebook.com/bizuply",
          "https://www.instagram.com/bizuply",
          "https://www.linkedin.com/company/bizuply"
        ]
      }
    </script>

    <!-- 🎨 Global CSS ONLY -->
    <link rel="stylesheet" href="/index.css" />
  </head>

  <body>
  <noscript>
    <!-- Meta Pixel noscript is platform-only; omitted on published customer hosts via JS gate above. -->
  </noscript>

  <div id="initial-bg"></div>
  <div id="root"></div>
  <div id="popup-root"></div>

  <script type="module" src="/src/index.tsx"></script>
</body>
</html>
