name: Secret scan

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tracked-tree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Scan tracked files for live secrets (values never printed)
        run: node --test scripts/ci/secretHygiene.test.cjs scripts/ci/openaiClientBundle.test.cjs
      - name: Gitleaks working tree only
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            | tar -xz gitleaks
          ./gitleaks detect --source . --no-git --redact --exit-code 1 --config .gitleaks.toml
