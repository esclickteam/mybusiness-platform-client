name: Bridge safety

on:
  pull_request:
  push:
    branches: [feature/saas-nocode-bridge]

jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Builder safety checks
        run: node --test scripts/saas-bridge-ui.test.mjs
