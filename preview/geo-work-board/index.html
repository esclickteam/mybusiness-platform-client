<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>תוכנית שיפור</title>
    <link rel="stylesheet" href="./board.css" />
  </head>
  <body>
    <div class="shell">
      <aside class="side" aria-label="ניווט">
        <strong>נראות במנועי מענה</strong>
        <p>תצוגה מהמדידות השמורות. אין מדידה חדשה ואין שינוי באתר.</p>
      </aside>
      <main>
        <header class="top">
          <div>
            <h1>תוכנית שיפור</h1>
            <p class="muted">המלצות מבוססות מדידות שמורות בלבד. שינוי באתר רק אחרי אישור.</p>
          </div>
          <div id="brands" class="switcher" aria-label="מותג"></div>
        </header>
        <div class="actions">
          <button id="toggle" type="button" class="btn ghost">תצוגת חשבון בלי הרשאת הרצה</button>
          <button id="trial" type="button" class="btn primary" hidden>הרצת מדידת ניסיון</button>
        </div>
        <p id="disclaimer" class="disclaimer"></p>
        <p id="counts" class="muted"></p>
        <p id="locked" class="warn">הזנה ידנית, מדידת ניסיון וייבוא מ־Search Console מוצגים רק לחשבון עם הרשאת הרצה.</p>
        <div id="run" class="actions" hidden>
          <button type="button" class="btn primary">שמור בדיקה ידנית</button>
          <button type="button" class="btn ghost">ייבוא מ־Search Console</button>
        </div>
        <div id="filters" class="filters" role="tablist" aria-label="סינון סטטוס"></div>
        <div id="tasks" class="tasks"></div>
      </main>
    </div>
    <script src="./board.js"></script>
  </body>
</html>
